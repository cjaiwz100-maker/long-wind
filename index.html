<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>长鹏行 · Chang Peng Xing</title>
<link rel="icon" href="data:,">
<meta name="description" content="A lone swordsman on a golden-hour grassland. Real-time three.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0d0b; --ink: #e8d3ad; --vermilion: #b8322a; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 1; font-family: 'Noto Serif SC', serif; color: var(--ink); }
  /* loader: a single brush stroke sweeps across as the grassland is built */
  #load { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none;
          background: radial-gradient(ellipse at 50% 48%, #1b1a15 0%, var(--bg) 70%); transition: opacity 1.3s ease; }
  #load.done { opacity: 0; }
  #load .wrap { display: grid; justify-items: center; gap: 22px; transform: translateY(-2vh); }
  #load .title { font-family: 'Ma Shan Zheng', 'Noto Serif SC', serif; font-size: min(92px, 18vw); color: var(--ink); letter-spacing: 0.08em; line-height: 1;
                 text-shadow: 0 0 24px rgba(232, 211, 173, 0.18); opacity: 0.92; }
  #load .sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; letter-spacing: 0.32em; color: rgba(232,211,173,0.55); text-transform: uppercase; }
  #load svg { width: min(360px, 70vw); height: 24px; overflow: visible; }
  #load .stroke { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0.985;
                  transition: stroke-dashoffset 0.5s cubic-bezier(.3,.7,.2,1); filter: url(#brush); opacity: 0.85; }
  #load .track { fill: none; stroke: rgba(232,211,173,0.07); stroke-width: 2; }
  #load .seal { width: 26px; height: 26px; border: 2px solid var(--vermilion); color: var(--vermilion); font-family: 'Ma Shan Zheng', serif;
                font-size: 15px; display: grid; place-items: center; border-radius: 3px; opacity: 0.8; }
  #load .label { font-size: 12px; letter-spacing: 0.3em; color: rgba(232,211,173,0.38); min-height: 1em; }
  @media (prefers-reduced-motion: reduce) { #load .stroke { transition: none; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hud"></div>
<div id="load" aria-hidden="true"><div class="wrap">
  <div class="title">长鹏行</div>
  <div class="sub">天苍苍 · 野茫茫</div>
  <svg viewBox="0 0 360 24">
    <defs><filter id="brush" x="-5%" y="-80%" width="110%" height="260%"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></defs>
    <path class="track" d="M6 12 C 90 9, 250 15, 354 11"/>
    <path id="stroke" class="stroke" pathLength="1" d="M6 12 C 90 9, 250 15, 354 11"/>
  </svg>
  <div class="label" id="loadLabel"></div>
  <div class="seal">剑</div>
</div></div>
<script>
  window.__load = function (p, label) {
    var e = document.getElementById('stroke'); if (!e) return;
    e.style.strokeDashoffset = String(1 - Math.max(0.015, Math.min(1, p)));
    if (label !== undefined) { var l = document.getElementById('loadLabel'); if (l) l.textContent = label; }
  };
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
